<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERVOBIȚII - Tribuna Virtuală</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #ff4757;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .upload-section {
            margin: 20px 0;
            padding: 15px;
            background: #2c2c2c;
            border-radius: 8px;
            text-align: center;
        }
        .upload-btn {
            cursor: pointer;
            background: #ff4757;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .upload-btn:hover {
            background: #ff6b81;
        }
        .clip-item {
            background: #2c2c2c;
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 6px;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NERVOBIȚII</h1>
        <p>Tribuna virtuală – Alternativa la Camera Deputaților (Limită de 3 minute).</p>

        <!-- Secțiunea de Upload Video -->
        <div class="upload-section">
            <h3>Adaugă un clip nou</h3>
            <label for="videoUpload" class="upload-btn">
                📁 Încarcă un video de pe dispozitiv
            </label>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;">
        </div>

        <!-- Secțiunea unde apar clipurile încărcate / propunerile -->
        <h2>Clipuri (Propuneri)</h2>
        <div id="clips-container">
            <!-- Aici vor fi inserate dinamic clipurile -->
        </div>
    </div>

    <script>
        // Ascultător pentru evenimentul de schimbare a fișierului din input
        document.getElementById('videoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                // Verificăm dacă fișierul selectat este de tip video
                if (!file.type.startsWith('video/')) {
                    alert('Te rog să selectezi un fișier video valid.');
                    return;
                }

                // Generăm un URL local temporar pentru fișierul video
                const videoUrl = URL.createObjectURL(file);
                
                // Mesaj de confirmare în consolă
                console.log("Video încărcat cu succes:", file.name);
                
                // Apelăm funcția pentru a adăuga clipul în interfață
                adaugaClipInLista({
                    url: videoUrl,
                    nume: file.name,
                    data: new Date().toLocaleDateString()
                });
            }
        });

        // Funcție pentru randarea clipului în containerul dedicat
        function adaugaClipInLista(clipData) {
            const containerClips = document.getElementById('clips-container'); 
            if (containerClips) {
                const clipElement = document.createElement('div');
                clipElement.classList.add('clip-item');
                clipElement.innerHTML = `
                    <video controls src="${clipData.url}"></video>
                    <p style="margin: 8px 0 0 0; font-weight: bold;">
                        ${clipData.nume} 
                        <span style="font-size: 0.8em; color: #aaa; font-weight: normal;">(${clipData.data})</span>
                    </p>
                `;
                // Adăugăm clipul cel nou în partea de sus a listei
                containerClips.prepend(clipElement);
            }
        }
    </script>

</body>
</html>
